name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

      - name: Prettier
        run: npm run format:check

  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}

# ---------------------------------------------------------------------------
# Deploy is deliberately not here yet.
#
# When you're ready, it goes in as a separate job gated on `needs: [lint,
# theme-check]` and `if: github.ref == 'refs/heads/main'`, running:
#
#   shopify theme push --theme $SHOPIFY_DEV_THEME_ID --path .
#
# It needs two repo secrets:
#   SHOPIFY_CLI_THEME_TOKEN  — a Theme Access token from the Theme Access app,
#                              NOT an Admin API key
#   SHOPIFY_FLAG_STORE       — trgcj0-r0.myshopify.com
#
# Push to a fixed theme ID, never `--unpublished`: that flag creates a brand
# new theme on every run and you'll hit the 20-theme limit within weeks.
#
# Dawn's original Lighthouse CI job was removed — it required five secrets
# (SHOP_STORE_OS2, SHOP_PASSWORD_OS2, SHOP_ACCESS_TOKEN, LHCI_GITHUB_TOKEN,
# SHOP_PULL_THEME) that don't exist on this repo, so it failed red on every
# push. Worth restoring once a dev theme exists to run it against.
# ---------------------------------------------------------------------------
